name: build

# M5: verify Dante actually compiles on Linux and macOS, not just Windows (the only
# platform it's been built on directly so far). This does not run Dante - GitHub's
# runners have no GPU - it only proves the CMake/compiler setup is sound per platform.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (Vulkan)
          - os: ubuntu-latest
            name: Linux (Vulkan)
          - os: macos-latest
            name: macOS (Metal)
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        if: runner.os != 'macOS'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get install -y ninja-build libglu1-mesa-dev libc++-17-dev libc++abi-17-dev \
              libxi-dev libxcomposite-dev libxxf86vm-dev
          echo "CC=clang-17" >> "$GITHUB_ENV"
          echo "CXX=clang++-17" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        # cl.exe isn't reliably on PATH by default on windows-latest - without this,
        # CMake's compiler auto-detection falls through to the MinGW g++ under
        # C:\mingw64 that the runner image also ships, which engine/CMakeLists.txt
        # explicitly rejects ("Detected CXX compiler GNU is unsupported"). This puts
        # MSVC's cl.exe/link.exe first on PATH for the rest of the job, deterministically
        # (not relying on whatever setup-vulkan-sdk happens to leave behind).
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        # Ninja everywhere, not the VS generator: CMake's "Visual Studio 17 2022"
        # generator does its own MSBuild/instance discovery and doesn't play well
        # once a dev-shell environment (see above) is already active - it fails with
        # "could not find any instance of Visual Studio". Ninja + cl.exe sidesteps that.
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel
